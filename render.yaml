# Gộp chung backend + frontend vào 1 Web Service DUY NHẤT (Express phục vụ luôn
# client/dist đã build — xem server/index.js). Không cần Static Site riêng nữa.
services:
  - type: web
    name: lado-b2b-agent
    env: node
    rootDir: .
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: node server/index.js
    envVars:
      # Nhà cung cấp tìm địa điểm mặc định. Đặt = google nếu bạn có billing account hợp lệ
      # ngoài Việt Nam và muốn dùng Google Places thay vì Vietmap.
      - key: PLACES_PROVIDER
        value: vietmap
      # BẮT BUỘC khi PLACES_PROVIDER=vietmap. Lấy key tại https://maps.vietmap.vn
      # sync: false -> Render sẽ hỏi bạn nhập giá trị thật khi deploy (không lưu key vào git).
      - key: VIETMAP_API_KEY
        sync: false
      # Tuỳ chọn: chỉ cần nếu chuyển PLACES_PROVIDER=google.
      - key: GOOGLE_MAPS_API_KEY
        sync: false